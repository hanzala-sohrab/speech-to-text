# stt-whisper sidecar — Flask server (server.py) on :8010, backing the
# `whisper` STT provider in backend/src/sales-intel/services/stt/providers/whisper.js.
#
#   docker compose up -d --build
#   docker compose logs -f
#
# No .env/secrets required — faster-whisper runs fully local, no API key.

services:
  stt-whisper:
    build:
      context: .
    image: stt-whisper-server:latest
    environment:
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      PORT: 8010
    # Bind only to loopback: the Node backend runs on the host (supervisor) and
    # reaches the sidecar at http://localhost:8010. Do not expose it publicly.
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      # Persist the downloaded faster-whisper model across restarts/rebuilds —
      # without this every container recreate re-downloads it from HF on first request.
      - whisper-model-cache:/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8010/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  whisper-model-cache:
